name: Update NVIDIA NIM Free Models

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC (11:00 Taipei)
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - scrape_models.py
      - .github/workflows/update-models.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run scraper
        run: |
          python scrape_models.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: update NVIDIA NIM models $(date -u +'%Y-%m-%d')"
          git push

      - name: Create backup artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          DATE=$(date -u +%Y%m%d)
          zip -r "nvidia-nim-models-backup-$DATE.zip" docs/
          echo "BACKUP_FILE=nvidia-nim-models-backup-$DATE.zip" >> $GITHUB_ENV

      - name: Upload backup artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-nim-models-backup-${{ env.DATE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## NVIDIA NIM Models Update" >> $GITHUB_STEP_SUMMARY
          echo "- Models updated: $(jq '.metadata.total_models' docs/models.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Free endpoints: $(jq '.metadata.free_endpoint_count' docs/models.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Downloadable: $(jq '.metadata.downloadable_count' docs/models.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Deprecated free: $(jq '.metadata.deprecated_count' docs/models.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Updated at: $(jq -r '.metadata.updated_at' docs/models.json)" >> $GITHUB_STEP_SUMMARY